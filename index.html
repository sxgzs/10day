.score-card .title{font-size:11px;color:#8b949e;letter-spacing:1px}
.score-card .score{font-size:36px;font-weight:800;margin:8px 0}

// ===== MACD Calculator =====
function ema(data,period){
  var r=[data[0]],k=2/(period+1);
  for(var i=1;i<data.length;i++)r.push(data[i]*k+r[i-1]*(1-k));
  return r;
}
function calcMACD(closes,fast,slow,signal){
  fast=fast||12;slow=slow||26;signal=signal||9;
  var e12=ema(closes,fast),e26=ema(closes,slow);
  var dif=[],dea,macd=[];
  for(var i=0;i<closes.length;i++)dif.push(e12[i]-e26[i]);
  dea=ema(dif,signal);
  for(var i=0;i<dif.length;i++)macd.push(2*(dif[i]-dea[i]));
  return{dif:dif,dea:dea,macd:macd};
}
function macdScore(macdData){
  var dif=macdData.dif,dea=macdData.dea,hist=macdData.macd,n=dif.length;
  if(n<5)return 5;
  var d=dif[n-1],e=dea[n-1],h=hist[n-1],hp=hist[n-2],s=5;
  if(d>e)s+=1.5;else s-=1.5;
  if(d>0)s+=1;else s-=1;
  if(h>0)s+=0.5;else s-=0.5;
  if(h>hp)s+=0.5;else s-=0.5;
  if(n>=5&&dif[n-1]>dif[n-5])s+=0.5;else s-=0.5;
  return Math.round(Math.max(0,Math.min(10,s))*10)/10;
}

  for(var i=1;i<boundaries.length-1;i++){markLines.push({xAxis:boundaries[i]});}
  var volColors=prices.map(function(p,i){if(i===0)return RED;return prices[i]>=prices[i-1]?RED:GREEN;});
  return{daily:daily,labels:labels,prices:prices,volumes:volumes,boundaries:boundaries,markAreas:markAreas,markLines:markLines,volColors:volColors,pMin:pMin,pMax:pMax};
}

// ===== Fetch =====
function fetchStock(){
  var code=document.getElementById("codeInput").value.trim();
  if(!code||code.length!==6||!/^\d{6}$/.test(code)){showE("请输入6位数字代码");return;}
  setL(true);hideE();
  var pfx=getPfx(code);
  Promise.all([
    fetch(M5_API+"?param="+pfx+code+",m5,,640").then(function(r){return r.json();}),
    fetch(FQ_API+"?param="+pfx+code+",day,,,200,qfq").then(function(r){return r.json();}),
    fetch(FQ_API+"?param="+pfx+code+",week,,,200,qfq").then(function(r){return r.json();})
  ]).then(function(arr){
    var m5=arr[0],dy=arr[1],wk=arr[2];
    if(m5.code!==0||dy.code!==0||wk.code!==0)throw new Error("API error");
    var sk=pfx+code;
    var m5d=m5.data[sk],dyd=dy.data[sk],wkd=wk.data[sk];
    if(!m5d||!m5d.m5||!dyd||!dyd.qfqday||!wkd||!wkd.qfqweek)throw new Error("数据缺失");

    // Name
    var name=code;
    if(m5d.qt){if(Array.isArray(m5d.qt)){name=m5d.qt[1]||code;}else{var ks=Object.keys(m5d.qt),k=ks.find(function(x){return x!=="market"&&x!=="zjlx";});if(k&&Array.isArray(m5d.qt[k])&&m5d.qt[k].length>1)name=m5d.qt[k][1]||code;}}
    document.getElementById("stockTitle").innerHTML=name+' <span class="sub" id="stockCode">'+code+'.'+pfx.toUpperCase()+'</span>';

    // Intraday
    var ir=procBars(m5d.m5);if(!ir)throw new Error("处理失败");

    // Daily raw
    var dailyRaw=m5d.m5?[]:[];
    dailyRaw=dyd.qfqday.map(function(b){return{date:b[0],open:parseFloat(b[1]),close:parseFloat(b[2]),high:parseFloat(b[3]),low:parseFloat(b[4]),volume:parseFloat(b[5])};});

    // Weekly raw
    var weeklyRaw=wkd.qfqweek.map(function(b){return{date:b[0],open:parseFloat(b[1]),close:parseFloat(b[2]),high:parseFloat(b[3]),low:parseFloat(b[4]),volume:parseFloat(b[5])};});

    // MACD
    var dc=dailyRaw.map(function(d){return d.close;});
    var wc=weeklyRaw.map(function(d){return d.close;});
    var dm=calcMACD(dc),wm=calcMACD(wc);
    var ds=macdScore(dm),ws=macdScore(wm),ts=Math.round((ds*0.4+ws*0.6)*10)/10;

    addH(code,name,pfx);
    renderScores(ds,ws,ts);
    renderStats(ir.daily);
    renderLegends(ir.daily);
    renderC1(ir);
    renderC2(ir);
    renderC3(dailyRaw,dm);
    renderC4(weeklyRaw,wm);
  }).catch(function(e){showE(e.message||"请求失败");}).finally(function(){setL(false);});
}

// ===== Render Scores =====
function renderScores(ds,ws,ts){
  function barColor(s){if(s>=7)return"#22c55e";if(s>=4)return"#eab308";return"#ef4444";}
  function label(s){if(s>=7)return"偏多";if(s>=4)return"中性";return"偏空";}
  var h='';
  h+='<div class="score-card"><div class="title">日线 MACD</div><div class="score" style="color:'+barColor(ds)+'">'+ds.toFixed(1)+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+(ds*10)+'%;background:'+barColor(ds)+'"></div></div><div class="tags">'+label(ds)+' (权重 40%)</div></div>';
  h+='<div class="score-card"><div class="title">周线 MACD</div><div class="score" style="color:'+barColor(ws)+'">'+ws.toFixed(1)+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+(ws*10)+'%;background:'+barColor(ws)+'"></div></div><div class="tags">'+label(ws)+' (权重 60%)</div></div>';
  h+='<div class="score-card" style="border-color:'+barColor(ts)+'"><div class="title">综合评分</div><div class="score" style="color:'+barColor(ts)+'">'+ts.toFixed(1)+'</div><div class="bar-wrap"><div class="bar-fill" style="width:'+(ts*10)+'%;background:'+barColor(ts)+'"></div></div><div class="tags">'+label(ts)+' | 日线×0.4 + 周线×0.6</div></div>';
  document.getElementById("scoreRow").innerHTML=h;
}

// ===== Render Stats (unchanged) =====
function renderStats(daily){
  var last=daily[daily.length-1],first=daily[0];
  var chg10=((last.close-first.open)/first.open*100).toFixed(2);
  var mx=Math.max.apply(null,daily.map(function(d){return d.high;}));
  var mn=Math.min.apply(null,daily.map(function(d){return d.low;}));
  var av=(daily.reduce(function(s,d){return s+d.volume;},0)/daily.length/10000).toFixed(0);
  function pc(v){return(v>=0?"+":"")+v.toFixed(2)+"%";}
  function cl(v){return v>=0?"up":"down";}
  var h="";
  h+='<div class="card"><div class="lbl">最新收盘</div><div class="val">'+last.close.toFixed(2)+'</div><div class="sub '+cl(last.chg)+'">'+pc(last.chg)+'</div></div>';
  h+='<div class="card"><div class="lbl">10日涨跌</div><div class="val '+cl(parseFloat(chg10))+'">'+pc(parseFloat(chg10))+'</div><div class="sub">'+first.date+' → '+last.date+'</div></div>';
  h+='<div class="card"><div class="lbl">10日最高</div><div class="val up">'+mx.toFixed(2)+'</div></div>';
  h+='<div class="card"><div class="lbl">10日最低</div><div class="val down">'+mn.toFixed(2)+'</div></div>';
  h+='<div class="card"><div class="lbl">日均量(万手)</div><div class="val">'+av+'</div><div class="sub">10日均值</div></div>';
  document.getElementById("statsBar").innerHTML=h;
}

function renderLegends(daily){
  var dates=daily.map(function(d){return d.date;}),h="";
  dates.forEach(function(d,i){var info=daily[i];h+='<span style="background:'+COLORS[i]+'20;border:1px solid '+COLORS[i]+'">'+d.slice(5)+" "+(info.chg>=0?"+":"")+info.chg.toFixed(2)+"%</span>";});
  document.getElementById("legends").innerHTML=h;
}

// ===== Chart 1: Intraday =====
function renderC1(r){
  if(!chart1)chart1=echarts.init(document.getElementById("c1"));
  var se=Math.max(1,Math.floor(r.labels.length/25));
  var lf=r.labels.map(function(l,i){return i%se===0?l:"";});
  chart1.setOption({
    backgroundColor:"transparent",
    tooltip:{trigger:"axis",backgroundColor:"rgba(22,27,34,0.95)",borderColor:"#30363d",textStyle:{color:"#c9d1d9",fontSize:11},
      formatter:function(ps){if(!ps||!ps[0])return"";var i=ps[0].dataIndex;return"<b>"+r.labels[i]+"</b><br/>价格: <b>"+r.prices[i].toFixed(2)+"</b><br/>量: "+(r.volumes[i]/100).toFixed(0)+"手";}
    },
    grid:{left:"3%",right:"1%",top:"3%",bottom:"8%"},
    dataZoom:[{type:"slider",start:0,end:100,height:20,bottom:0,borderColor:"#30363d",backgroundColor:"#161b22",fillerColor:"rgba(88,166,255,0.15)",textStyle:{color:"#8b949e",fontSize:10}}],
    xAxis:{type:"category",data:lf,boundaryGap:false,axisLine:{lineStyle:{color:"#30363d"}},axisTick:{show:false},axisLabel:{color:"#8b949e",fontSize:9,rotate:45,interval:0},splitLine:{show:false}},
    yAxis:{type:"value",min:r.pMin,max:r.pMax,axisLabel:{color:"#8b949e",fontSize:10,formatter:function(v){return v.toFixed(2);}},splitLine:{lineStyle:{color:"#21262d",type:"dashed"}}},
    series:[{type:"line",data:r.prices,symbol:"none",smooth:false,lineStyle:{color:"#58a6ff",width:1},
      areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"rgba(88,166,255,0.25)"},{offset:1,color:"rgba(88,166,255,0.02)"}])},
      markArea:{silent:true,data:r.markAreas,itemStyle:{color:"rgba(255,255,255,0.03)"}},
      markLine:{silent:true,symbol:"none",data:r.markLines,lineStyle:{color:"#30363d",type:"dashed",width:1}}
    }]
  });
}

function renderC2(r){
  if(!chart2)chart2=echarts.init(document.getElementById("c2"));
  var se=Math.max(1,Math.floor(r.labels.length/25));
  var lf=r.labels.map(function(l,i){return i%se===0?l:"";});
  chart2.setOption({
    backgroundColor:"transparent",tooltip:{trigger:"axis",backgroundColor:"rgba(22,27,34,0.95)",borderColor:"#30363d",textStyle:{color:"#c9d1d9",fontSize:11}},
    grid:{left:"3%",right:"1%",top:"5%",bottom:"0%"},
    xAxis:{type:"category",data:lf,boundaryGap:false,axisLine:{lineStyle:{color:"#30363d"}},axisTick:{show:false},axisLabel:{show:false},splitLine:{show:false}},
    yAxis:{type:"value",axisLabel:{color:"#8b949e",fontSize:9,formatter:function(v){return(v/10000).toFixed(0)+"万";}},splitLine:{lineStyle:{color:"#21262d",type:"dashed"}}},
    series:[{type:"bar",data:r.volumes.map(function(v,i){return{value:v,itemStyle:{color:r.volColors[i]}};}),large:true}]
  });
}

// ===== Chart 3: Daily K-line + MACD =====
function renderC3(dailyRaw,macd){
  if(!chart3)chart3=echarts.init(document.getElementById("c3"));
  var dates=dailyRaw.map(function(d){return d.date.slice(5);});
  var macdDates=dates;
  chart3.setOption({
    backgroundColor:"transparent",
    tooltip:{trigger:"axis",axisPointer:{type:"cross"},backgroundColor:"rgba(22,27,34,0.95)",borderColor:"#30363d",textStyle:{color:"#c9d1d9",fontSize:11}},
    grid:[{left:"3%",right:"3%",top:"3%",height:"40%"},{left:"3%",right:"3%",top:"50%",height:"22%"},{left:"3%",right:"3%",top:"78%",height:"15%"}],
    xAxis:[{type:"category",data:dates,gridIndex:0,axisLabel:{show:false},axisLine:{lineStyle:{color:"#30363d"}}},{type:"category",data:dates,gridIndex:1,axisLabel:{show:false},axisLine:{lineStyle:{color:"#30363d"}}},{type:"category",data:macdDates,gridIndex:2,axisLabel:{color:"#8b949e",fontSize:9,rotate:45,interval:Math.floor(dates.length/8)},axisLine:{lineStyle:{color:"#30363d"}}}],
    yAxis:[{type:"value",scale:true,gridIndex:0,axisLabel:{color:"#8b949e",fontSize:9},splitLine:{lineStyle:{color:"#21262d",type:"dashed"}}},{type:"value",gridIndex:1,axisLabel:{color:"#8b949e",fontSize:9,formatter:function(v){return(v/10000).toFixed(0)+"万";}},splitLine:{show:false}},{type:"value",gridIndex:2,axisLabel:{color:"#8b949e",fontSize:8},splitLine:{lineStyle:{color:"#21262d",type:"dashed"}}}],
    series:[
      {name:"K线",type:"candlestick",xAxisIndex:0,yAxisIndex:0,data:dailyRaw.map(function(d){return[d.open,d.close,d.low,d.high];}),itemStyle:{color:RED,color0:GREEN,borderColor:RED,borderColor0:GREEN}},
      {name:"量",type:"bar",xAxisIndex:1,yAxisIndex:1,data:dailyRaw.map(function(d){return{value:d.volume,itemStyle:{color:d.close>=d.open?RED+"80":GREEN+"80"}};})},
      {name:"DIF",type:"line",xAxisIndex:2,yAxisIndex:2,data:macd.dif,symbol:"none",lineStyle:{color:"#eab308",width:1}},
      {name:"DEA",type:"line",xAxisIndex:2,yAxisIndex:2,data:macd.dea,symbol:"none",lineStyle:{color:"#58a6ff",width:1}},
      {name:"MACD",type:"bar",xAxisIndex:2,yAxisIndex:2,data:macd.macd.map(function(v){return{value:v,itemStyle:{color:v>=0?RED:GREEN}};})}
    ]
  });
}

// ===== Chart 4: Weekly K-line + MACD =====

    series:[
      {name:"K线",type:"candlestick",xAxisIndex:0,yAxisIndex:0,data:weeklyRaw.map(function(d){return[d.open,d.close,d.low,d.high];}),itemStyle:{color:RED,color0:GREEN,borderColor:RED,borderColor0:GREEN}},

      {name:"DIF",type:"line",xAxisIndex:2,yAxisIndex:2,data:macd.dif,symbol:"none",lineStyle:{color:"#eab308",width:1}},

}

function setL(v){document.getElementById("fetchBtn").disabled=v;document.getElementById("loading").style.display=v?"block":"none";}
function showE(m){var e=document.getElementById("errMsg");e.textContent=m;e.style.display="block";}
function hideE(){document.getElementById("errMsg").style.display="none";}

document.getElementById("codeInput").addEventListener("keydown",function(e){if(e.key==="Enter")fetchStock();});

// ===== Init =====
(function(){
  renderH();
  renderScores(INIT.dScore,INIT.wScore,INIT.tScore);
  renderStats(INIT.intraDaily);
  renderLegends(INIT.intraDaily);
  var b=INIT.intraBounds,ma=[],ml=[];
  for(var i=0;i<b.length-1;i++){if(i%2===0)ma.push([{xAxis:b[i]},{xAxis:b[i+1]-1}]);}
  for(var i=1;i<b.length-1;i++){ml.push({xAxis:b[i]});}
  var vc=INIT.intraPrices.map(function(p,i){return i===0?RED:(INIT.intraPrices[i]>=INIT.intraPrices[i-1]?RED:GREEN);});
  var r={labels:INIT.intraLabels,prices:INIT.intraPrices,volumes:INIT.intraVols,boundaries:INIT.intraBounds,markAreas:ma,markLines:ml,volColors:vc,pMin:INIT.intraPmin,pMax:INIT.intraPmax};
  renderC1(r);renderC2(r);renderC3(INIT.dailyRaw,INIT.dailyMacd);renderC4(INIT.weeklyRaw,INIT.weeklyMacd);
  if(!loadH().length)addH(INIT.code,INIT.name,INIT.pfx);
})();

window.addEventListener("resize",function(){if(chart1)chart1.resize();if(chart2)chart2.resize();if(chart3)chart3.resize();if(chart4)chart4.resize();});
